name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    name: gates (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create the environment
        run: uv venv --python ${{ matrix.python }}

      - name: Install (editable, with dev extras)
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type-check (strict)
        run: uv run mypy

      # The realmodel tier needs a local Ollama and the swebench_harness tier Docker images; CI
      # runners have neither. They run locally (`-m realmodel`, `-m swebench_harness`), as the
      # tests' own docstrings say. UI sprint 106: this step ran them, and an unguarded realmodel
      # test failed every job.
      - name: Tests
        run: uv run pytest -m "not realmodel and not swebench_harness"

      - name: Import contract (F-API-6)
        run: uv run lint-imports

      # The throughput floor (conformance check 15 / N-PERF-1) is hardware-sensitive, so it is
      # deliberately OFF the CI matrix: --no-perf makes check 15 an honest SKIP. The floor is
      # verified separately on controlled hardware (SUBSTRATE_PERF_GATE=1; see CONTRIBUTING.md).
      - name: Conformance (no perf floor)
        run: uv run substrate conformance --no-perf

      # Sprint 175 (F13): fail CI on any commit that deletes a file under `_deprecated/`.
      # AGENTS.md hard rule 12 says restructures land as new files and the audit trail is the
      # work; retired-in-place artifacts under `_deprecated/` are the concrete pattern. The
      # guard reads git diff; needs full history so the base ref is resolvable.
      - name: Fetch base ref for _deprecated/ guard
        run: git fetch --no-tags --depth=1 origin main
      - name: _deprecated/ preservation guard
        run: bash scripts/check_deprecated_preserved.sh
