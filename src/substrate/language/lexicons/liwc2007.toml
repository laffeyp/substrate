[lexicon]
name = "liwc2007"
version = 1
preprocessing = "substrate-text-1"
kind = "word-categories"
description = "LIWC2007 categories: function words and the nine language-style-matching categories, persons, tentative and certainty words, positive emotion, and informal markers."
source = "Pennebaker, Booth & Francis (2007), LIWC2007, English dictionary (4,487 entries, 64 categories); categories used for LSM: Ireland, Slatcher, Eastwick, Scissors, Finkel & Pennebaker (2011), Psychological Science 22(1), 39-44, Table 1"
data = "LIWC2007_English.dic, github.com/illidanlab/subject-harmonization at 418369867f80a6c006988928cb3be623011a2e0d, SHA-256 e586afedd2bc4cab9960b45dbacfab0c2c5329cd70824968efa0911db049c535"
licence = "LIWC2007 dictionary, Pennebaker Conglomerates; entries used as published"
built_by = "scripts/build_lexicon_liwc2007.py"
construction = "Each category is copied from the dictionary entry by entry, case-folded, with the LIWC category names mapped to the names here (funct -> function_words, preps -> prepositions, adverb -> high_frequency_adverbs, ...). A word may sit in several categories, as in LIWC."
wildcard = "*"
notes = "An entry ending in * matches every token that starts with the part before it (LIWC convention). LIWC lists some contractions both with and without the apostrophe (dont, don't); both are kept."

[lsm]
categories = ["personal_pronouns", "impersonal_pronouns", "articles", "conjunctions", "prepositions", "auxiliary_verbs", "high_frequency_adverbs", "negations", "quantifiers"]
formula = "per category: 1 - |p1 - p2| / (p1 + p2 + 0.0001), p = the category percentage of all word tokens; LSM = the mean over the nine categories"
source = "Ireland et al. (2011), p. 40"

