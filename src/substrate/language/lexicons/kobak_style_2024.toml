data = "https://github.com/berenslab/llm-excess-vocab at 53db991afc251782106cd817a1c3fa47a4d41781"
licence = "MIT (Copyright (c) 2024 Dmitry Kobak, Rita González-Márquez)"
built_by = "scripts/build_lexicon_kobak.py"
construction = "Repeats the selection in the authors' scripts/03-figures.ipynb (cells 3, 7, 12, 25-26) on their yearly counts and their style annotations; the result equals the notebook's saved output."
