[lexicon]
name = "function-words"
version = 1
preprocessing = "substrate-text-1"
kind = "word-categories"
description = "English function words in the nine categories language style matching uses."
source = "Categories: Ireland, Slatcher, Eastwick, Scissors, Finkel & Pennebaker (2011), 'Language Style Matching Predicts Relationship Initiation and Stability', Psychological Science 22(1), 39-44, Table 1 (LIWC2007 categories). Words: built by Substrate; LIWC's dictionaries are not used"
licence = "Substrate (this repository), PolyForm-Noncommercial-1.0.0"
construction = "Each category is the closed English word class the paper names, enumerated by Substrate in substrate-text-1 token form. As in LIWC, a word may sit in two categories: contractions of a pronoun and an auxiliary count in both, negative auxiliaries count as auxiliaries and negations, and 'neither' and 'nor' as conjunctions and negations."
notes = "Values computed with these lists are not LIWC values and do not equal LSM scores computed with LIWC2007 or LIWC-22. 'that' is listed only as an impersonal pronoun, 'as' and 'so' only as conjunctions, and 'like' in no category; 'like' is in hedges.toml."

[lsm]
categories = ["personal_pronouns", "impersonal_pronouns", "articles", "conjunctions", "prepositions", "auxiliary_verbs", "high_frequency_adverbs", "negations", "quantifiers"]
formula = "per category: 1 - |p1 - p2| / (p1 + p2 + 0.0001), p = the category's percentage of all word tokens; LSM = the mean over the nine categories"
source = "Ireland et al. (2011), p. 40"

