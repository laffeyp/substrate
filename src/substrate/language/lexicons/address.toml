[lexicon]
name = "address"
version = 1
preprocessing = "substrate-text-1"
kind = "word-categories"
description = "Person and address: second person, first person singular and first person plural."
source = "Built by Substrate from the English personal pronoun paradigm and its contractions"
licence = "Substrate (this repository), PolyForm-Noncommercial-1.0.0"
construction = "Closed class: every form of each person, with the contractions substrate-text-1 keeps as one token."
notes = "Vocatives (names used to address someone) are not a closed class and are not listed. 'us' in 'let's' is counted once, as 'let's'."

[categories]
second_person = [
  "you",
  "your",
  "yours",
  "yourself",
  "yourselves",
  "you're",
  "you've",
  "you'll",
  "you'd",
  "y'all",
]
first_singular = [
  "i",
  "me",
  "my",
  "mine",
  "myself",
  "i'm",
  "i've",
  "i'll",
  "i'd",
]
first_plural = [
  "we",
  "us",
  "our",
  "ours",
  "ourselves",
  "we're",
  "we've",
  "we'll",
  "we'd",
  "let's",
]
