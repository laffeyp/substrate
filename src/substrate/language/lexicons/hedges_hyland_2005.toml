[lexicon]
name = "hedges-hyland-2005"
version = 1
preprocessing = "substrate-text-1"
kind = "terms"
description = "Hyland's hedging items: words and phrases that withhold full commitment to a proposition."
source = "Hyland (2005), Metadiscourse: Exploring Interaction in Writing, Continuum, p. 218, as reproduced in Vázquez Orta & Giner (2008), 'Beyond mood and modality: epistemic modality markers as hedges in research articles', Revista Alicantina de Estudios Ingleses 21, 171-190 doi 10.14198/raei.2008.21.10, 'Hyland's hedging items'"
licence = "published list, used as published"
construction = "Transcribed from Vázquez Orta & Giner (2008) and checked against the same list in Liu, Salvi, Schoenegger et al. (arXiv 2505.09662, appendix), case-folded, curly apostrophes made straight. Two printing slips corrected: 'in my view in this view' is two items, and 'rather x' (rather before an adjective) is entered as 'rather'."
notes = "97 items. Hyland counted each occurrence in context; a token count of these items counts candidates ('about', 'around', 'should' and 'would' have uses that are not hedges)."

