[lexicon]
name = "padding"
version = 1
preprocessing = "substrate-text-1"
kind = "phrase-categories"
description = "Phrases that add words without adding facts: restating the question, background before the answer, closing summaries, offers of more."
source = "Built by Substrate. The four categories are the ones Substrate's terse length text removes ('Leave out background, restatement and offers of more', topologies/session/vocabulary.py LENGTH_TEXTS) and the dellm skill's 'formulaic scaffolding' (skills/dellm/SKILL.md); Wikipedia's 'Signs of AI writing' was read as a catalogue of examples; no text is copied from it"
licence = "Substrate (this repository), PolyForm-Noncommercial-1.0.0"
construction = "Fixed phrases chosen by Substrate, in substrate-text-1 token form ('TL;DR' -> 'tl dr')."
notes = "Position decides meaning for some phrases: 'overall' opening a closing paragraph pads, 'overall' inside a sentence may not. Sprint 304 defines where each category is counted."

[categories]
restatement = [
  "you asked",
  "you're asking",
  "you are asking",
  "you want to know",
  "your question",
  "the question is",
  "to answer your question",
  "great question",
  "good question",
  "that's a great question",
  "that's a good question",
  "as you mentioned",
  "as you said",
  "as you noted",
  "if i understand correctly",
  "so you're saying",
]
