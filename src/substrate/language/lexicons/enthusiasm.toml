[lexicon]
name = "enthusiasm"
version = 1
preprocessing = "substrate-text-1"
kind = "word-categories"
description = "Words and phrases of enthusiasm and praise, which the dry tone removes."
source = "Built by Substrate"
licence = "Substrate (this repository), PolyForm-Noncommercial-1.0.0"
construction = "Evaluative adjectives of strong approval, emotion words of excitement, interjections and fixed phrases of praise or eagerness, chosen by Substrate. Exclamation marks are counted by the format measures, not here."
notes = "'great', 'perfect' and 'nice' also describe things literally ('a great deal', 'perfect square'); counts include both. 'definitely' and 'absolutely' are also in boosters.toml or intensifiers.toml."

[entries]
words = [
  "great",
  "amazing",
  "awesome",
  "fantastic",
  "excellent",
  "wonderful",
  "perfect",
  "incredible",
  "brilliant",
  "terrific",
  "superb",
  "outstanding",
  "delighted",
  "thrilled",
  "excited",
  "exciting",
  "love",
  "glad",
  "wow",
  "yay",
  "hooray",
  "congratulations",
  "congrats",
  "absolutely",
  "definitely",
  "nice",
]
phrases = [
  "great question",
  "good question",
  "good catch",
  "great catch",
  "happy to help",
  "glad to help",
  "i'd love to",
  "i love",
  "love this",
  "love that",
  "you're welcome",
  "my pleasure",
  "no problem",
  "sounds great",
  "nice work",
  "great work",
  "well done",
  "good news",
  "great news",
  "excellent question",
]
