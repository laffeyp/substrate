[lexicon]
name = "hedges-ulinski-2019"
version = 1
preprocessing = "substrate-text-1"
kind = "terms"
description = "Potential hedge words and phrases: relational hedges (the speaker's commitment) and propositional hedges (uncertainty in the content)."
source = "Ulinski & Hirschberg (2019), 'Crowdsourced Hedge Term Disambiguation', Proceedings of the 13th Linguistic Annotation Workshop, ACL, pp. 1-5, Table 1 (aclanthology.org/W19-4001)"
licence = "CC BY 4.0 (ACL Anthology, materials published in or after 2016); the added forms are Substrate's"
construction = "relational and propositional: Table 1 transcribed in substrate-text-1 token form ('I mean' -> 'i mean'); 117 terms, the paper's count. added: Substrate's inflected forms of the published verbs, and 'i'd say' for 'i would say'; kept apart so the published list can be counted alone."
notes = "The paper calls these potential hedges: in its forum corpus some terms were hedges in under 10% of uses ('about', 'like', 'read'). A count of these terms is a count of candidates, not of disambiguated hedges."

